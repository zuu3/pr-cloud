name: CI

on:
  push:
    branches: [main, rabbitfish]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run build
        env:
          DATABASE_URL: postgres://build:build@localhost:5432/build
          NEXTAUTH_SECRET: build
          NEXTAUTH_URL: http://localhost:3000
          GOOGLE_CLIENT_ID: build
          GOOGLE_CLIENT_SECRET: build
          GOOGLE_HD: example.com
          S3_ENDPOINT_EXTERNAL: http://localhost:9000
          S3_ENDPOINT_INTERNAL: http://localhost:9000
          S3_REGION: us-east-1
          S3_BUCKET: build
          S3_ACCESS_KEY: build
          S3_SECRET_KEY: build
          SEED_ADMIN_EMAIL: build@example.com
          NEXT_PUBLIC_SINGLE_PUT_MAX_BYTES: "83886080"
      # unit + integration: embedded-postgres + in-process S3 stub, no services needed
      - run: npm test

  e2e:
    runs-on: ubuntu-latest
    # browser smoke test; a flaky service image shouldn't block the pipeline
    continue-on-error: true
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: promo
          POSTGRES_PASSWORD: promo
          POSTGRES_DB: promovideo
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U promo" --health-interval 5s
          --health-timeout 5s --health-retries 10
      minio:
        image: bitnami/minio:2024.6.13
        env:
          MINIO_ROOT_USER: minioadmin
          MINIO_ROOT_PASSWORD: minioadmin
          MINIO_DEFAULT_BUCKETS: promo-video
        ports: ["9000:9000"]
    env:
      DATABASE_URL: postgresql://promo:promo@localhost:5432/promovideo
      NEXTAUTH_SECRET: e2e-secret
      NEXTAUTH_URL: http://localhost:3000
      GOOGLE_CLIENT_ID: e2e
      GOOGLE_CLIENT_SECRET: e2e
      GOOGLE_HD: school.ac.kr
      S3_ENDPOINT_EXTERNAL: http://localhost:9000
      S3_ENDPOINT_INTERNAL: http://localhost:9000
      S3_REGION: us-east-1
      S3_BUCKET: promo-video
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      SEED_ADMIN_EMAIL: admin@school.ac.kr
      NEXT_PUBLIC_SINGLE_PUT_MAX_BYTES: "83886080"
      E2E_AUTH: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - run: npx tsx scripts/setup-bucket.ts
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test

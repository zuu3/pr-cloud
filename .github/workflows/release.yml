name: Release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---- Docker image (optional path) ----
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,format=short
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---- bare-metal bundle: standalone build + prisma CLI, tarred to a Release ----
  bundle:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npx prisma generate

      - name: build
        run: npm run build
        env:
          DATABASE_URL: postgres://build:build@localhost:5432/build
          NEXTAUTH_SECRET: build
          NEXTAUTH_URL: http://localhost:3000
          GOOGLE_CLIENT_ID: build
          GOOGLE_CLIENT_SECRET: build
          GOOGLE_HD: example.com
          S3_ENDPOINT_EXTERNAL: http://localhost:9000
          S3_ENDPOINT_INTERNAL: http://localhost:9000
          S3_REGION: us-east-1
          S3_BUCKET: build
          S3_ACCESS_KEY: build
          S3_SECRET_KEY: build
          SEED_ADMIN_EMAIL: build@example.com
          NEXT_PUBLIC_SINGLE_PUT_MAX_BYTES: "83886080"

      - name: assemble bundle
        run: |
          set -e
          mkdir -p dist
          cp -r .next/standalone/. dist/
          mkdir -p dist/.next
          cp -r .next/static dist/.next/static
          cp -r public dist/public
          cp -r prisma dist/prisma
          cp -r node_modules/.prisma dist/node_modules/.prisma
          cp deploy/run.sh dist/run.sh && chmod +x dist/run.sh
          cp deploy/redeploy.sh dist/redeploy.sh && chmod +x dist/redeploy.sh
          cp deploy/promo.service dist/promo.service
          # prisma CLI + full dep closure (effect / @prisma/config / @prisma/engines)
          mkdir -p /tmp/pc && (cd /tmp/pc && npm init -y >/dev/null && npm i --omit=dev --no-audit --no-fund prisma@6.19.3)
          mkdir -p dist/prisma-cli && cp -r /tmp/pc/node_modules dist/prisma-cli/node_modules
          tar -C dist -czf promo-bundle.tar.gz .
          ls -lh promo-bundle.tar.gz

      - name: publish to the "bundle" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: bundle
          name: bare-metal bundle (rolling)
          body: "Standalone build + prisma CLI. Rebuilt on every main push. commit ${{ github.sha }}"
          files: promo-bundle.tar.gz
          make_latest: false

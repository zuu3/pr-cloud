services:
  api:
    image: ghcr.io/zuu3/pr-cloud:latest
    restart: always
    ports:
      - "8080:3000" # nginx on the VM proxies :443 -> :8080
    env_file: /etc/promo/promo.env
    # 2GiB VM: keep the app from eating everything if ffmpeg spikes
    mem_limit: 1500m
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:3000/api/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3

services:
  api:
    image: registry/promo-video-api:latest
    restart: always
    ports:
      - "8080:3000"
    env_file: /etc/promo/promo.env
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:3000/api/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
